version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    versioning-strategy: lockfile-only
    groups:
      cargo-lock-maintenance:
        patterns: ['*']
        update-types: [minor, patch]
    # Major source migrations require a dedicated manifest PR; never hide one
    # inside the lockfile-only maintenance group.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']

  - package-ecosystem: npm
    directory: /web/admin
    schedule:
      interval: weekly
      day: monday
      time: '07:10'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      admin-maintenance:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:20'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      workflow-actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /.github/actions/node-setup
    schedule:
      interval: weekly
      day: monday
      time: '07:30'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      node-setup-actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /.github/actions/rust-setup
    schedule:
      interval: weekly
      day: monday
      time: '07:40'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      rust-setup-actions:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '07:50'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      runtime-images:
        patterns: ['*']
        update-types: [minor, patch]

  - package-ecosystem: docker-compose
    directory: /examples/compose
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    groups:
      compose-images:
        patterns: ['*']
        update-types: [minor, patch]
