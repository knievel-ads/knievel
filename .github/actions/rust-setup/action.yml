name: 'rust-setup'
description: >-
  Activate the repository toolchain from rust-toolchain.toml, add optional
  targets, and restore one Swatinem/rust-cache layer. The caller must check
  out the repository before invoking this local action.

inputs:
  shared-key:
    description: 'rust-cache shared key'
    required: false
    default: 'knievel-ci'
  working-directory:
    description: 'Directory containing rust-toolchain.toml (supports nested checkouts)'
    required: false
    default: '.'
  workspaces:
    description: 'Newline-separated rust-cache workspace -> target mappings'
    required: false
    default: '. -> target'
  targets:
    description: 'Comma-separated rustup target triples to install'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Activate repository Rust toolchain
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        REQUESTED_TARGETS: ${{ inputs.targets }}
      run: |
        set -euo pipefail
        # With no CLI toolchain argument, rustup discovers channel,
        # components, and profile from rust-toolchain.toml. Keeping the version
        # out of this action leaves that file authoritative.
        rustup toolchain install --no-self-update
        rustup show active-toolchain
        if [[ -n "$REQUESTED_TARGETS" ]]; then
          IFS=',' read -r -a targets <<< "$REQUESTED_TARGETS"
          rustup target add "${targets[@]}"
        fi
        rustc --version --verbose

    - name: Restore Cargo cache
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        shared-key: ${{ inputs.shared-key }}
        workspaces: ${{ inputs.workspaces }}
        cache-on-failure: 'true'
