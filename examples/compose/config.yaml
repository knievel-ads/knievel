# Effective configuration for the reference Compose stack.
# The file is mounted at /etc/knievel/config.yaml.

api:
  bind_addr: 0.0.0.0:8080
  # Required by ApiConfig. The current decision builder still returns relative
  # /e/... tracking paths; this value is parsed but not applied there.
  public_base_url: http://localhost:8080
  allowed_origins: []
  shutdown_drain_timeout_secs: 30
  # Parsed but not enforced by current shutdown code.
  shutdown_total_timeout_secs: 60

database:
  url: postgres://knievel_app:dev@knievel-postgres:5432/knievel?sslmode=disable
  max_connections: 8
  auto_migrate: true
  required: true
  connect_retry:
    attempts: 5
    initial_backoff_ms: 1000
    max_backoff_ms: 16000

logging:
  level: info
  format: json
  request_log_enabled: true
  request_log_skip_paths:
    - /healthz
    - /readyz
  request_log_slow_ms: 1000

decisions:
  force_overrides_enabled: true

events:
  channel_capacity: 8192

partitions:
  # Old leaves are detached, not dropped.
  retention_days: 30

auth:
  jwt:
    # Empty keeps this stack opaque-only. Opaque mode has no disable switch.
    issuers: []
