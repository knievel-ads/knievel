# Knievel reference stack.
#
# The runtime Dockerfile packages prebuilt binaries; Compose does not compile
# the repository. Build a local image with:
#   cargo xtask build-image --tag knievel:local
# then set KNIEVEL_IMAGE=knievel:local.

name: knievel

services:
  knievel-postgres:
    image: postgres:16
    # Bootstrap as postgres; init.sql creates knievel_app NOSUPERUSER from the
    # start so RLS tests and local traffic do not silently bypass policies.
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: knievel
    volumes:
      - knievel-pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U knievel_app -d knievel"]
      interval: 2s
      retries: 30
    ports:
      - "127.0.0.1:5432:5432"

  knievel:
    # The current release workflow maintains the mutable major tag `0` plus
    # X.Y.Z, X.Y, and sha-<commit> tags. Override with a local image or an
    # immutable repository@sha256:... reference when reproducibility matters.
    image: ${KNIEVEL_IMAGE:-ghcr.io/knievel-ads/knievel:0}
    depends_on:
      knievel-postgres:
        condition: service_healthy
    environment:
      KNIEVEL_CONFIG: /etc/knievel/config.yaml
    volumes:
      - ./config.yaml:/etc/knievel/config.yaml:ro
    ports:
      - "8080:8080"

  knievel-seed:
    # Manually invoked one-shot tool. Run it only after /healthz is available,
    # and pass the host UID/GID so ../../tmp/knievel-dev-token is writable and
    # host-owned:
    #   docker compose run --rm --user "$(id -u):$(id -g)" knievel-seed
    image: ${KNIEVEL_IMAGE:-ghcr.io/knievel-ads/knievel:0}
    depends_on:
      knievel-postgres:
        condition: service_healthy
    entrypoint: ["/usr/local/bin/knievel-cli"]
    command:
      - seed-demo
      - --org-external-id=demo-org
      - --project-external-id=demo-project
      - --token=kvl_dev_org_compose_dev
      - --write-token-to=/out/knievel-dev-token
    environment:
      DATABASE_URL: postgres://knievel_app:dev@knievel-postgres:5432/knievel?sslmode=disable
    volumes:
      - ../../tmp:/out
    restart: "no"

volumes:
  knievel-pgdata:
