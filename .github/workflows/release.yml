name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Serialize every release, not merely reruns of one tag. A later tag must not
# race an earlier tag's mutable aliases or downstream main update.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/knievel

jobs:
  preflight:
    name: release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      version: ${{ steps.verify.outputs.version }}
      sha: ${{ steps.verify.outputs.sha }}
    steps:
      - name: Checkout complete tag history without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Fetch complete canonical main and tag refs
        run: |
          set -euo pipefail
          if [[ $(git rev-parse --is-shallow-repository) == true ]]; then
            git fetch --unshallow origin
          fi
          git fetch --force origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/tags/*:refs/tags/*'
      # Do not compile or execute repository code before this check. The tag's
      # workflow is defense in depth; owner-enforced protected main and v* tag
      # rules remain mandatory because a malicious tag supplies its workflow.
      - name: Verify trusted release boundary and immutable metadata
        id: verify
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" == tag ]]
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          RELEASE_SHA=$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")
          export RELEASE_SHA
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" refs/remotes/origin/main

          python3 <<'PY'
          import os
          import pathlib
          import re
          import subprocess
          import tomllib

          root = pathlib.Path('.')
          tag = os.environ['RELEASE_TAG']
          sha = os.environ['RELEASE_SHA']
          match = re.fullmatch(r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', tag)
          if match is None:
              raise SystemExit(f'non-canonical release tag: {tag}')
          target = tuple(int(part) for part in match.groups())
          version = '.'.join(str(part) for part in target)

          prior = []
          tags = subprocess.check_output(
              ['git', 'tag', '--list', 'v*'], text=True
          ).splitlines()
          for candidate in tags:
              if candidate == tag:
                  continue
              candidate_match = re.fullmatch(
                  r'v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)',
                  candidate,
              )
              if candidate_match:
                  prior.append(tuple(int(part) for part in candidate_match.groups()))
          if prior and target <= max(prior):
              raise SystemExit(
                  f'{tag} is not newer than highest existing release '
                  f'v{".".join(map(str, max(prior)))}'
              )

          def load_toml(path):
              with path.open('rb') as handle:
                  return tomllib.load(handle)

          manifest = load_toml(root / 'Cargo.toml')
          workspace_package = manifest['workspace']['package']
          if workspace_package.get('version') != version:
              raise SystemExit('Cargo workspace version does not match the tag')
          if workspace_package.get('license') != 'MIT':
              raise SystemExit('Cargo workspace license must be MIT')

          def workspace_or_exact(package, key, expected, label):
              value = package.get(key)
              if value == expected:
                  return
              if isinstance(value, dict) and value.get('workspace') is True:
                  return
              raise SystemExit(f'{label} must be {expected!r} or inherit workspace metadata')

          manifest_paths = [root / 'Cargo.toml']
          for member in manifest['workspace']['members']:
              if any(token in member for token in ('*', '?', '[')):
                  raise SystemExit(f'globbed workspace member is not allowed: {member}')
              manifest_paths.append(root / member / 'Cargo.toml')

          local_names = set()
          for path in manifest_paths:
              package = load_toml(path)['package']
              name = package['name']
              if name in local_names:
                  raise SystemExit(f'duplicate local package name: {name}')
              local_names.add(name)
              workspace_or_exact(package, 'version', version, f'{path} version')
              workspace_or_exact(package, 'license', 'MIT', f'{path} license')

          lock = load_toml(root / 'Cargo.lock')
          for name in local_names:
              packages = [
                  package for package in lock['package']
                  if package.get('name') == name and 'source' not in package
              ]
              if len(packages) != 1 or packages[0].get('version') != version:
                  raise SystemExit(f'Cargo.lock local package {name} does not match {version}')

          openapi_lines = (root / 'openapi.yaml').read_text().splitlines()
          in_info = False
          openapi_version = None
          for line in openapi_lines:
              if line == 'info:':
                  in_info = True
                  continue
              if in_info and line and not line.startswith((' ', '\t')):
                  break
              if in_info:
                  value_match = re.fullmatch(r'\s+version:\s*["\']?([^"\']+?)["\']?\s*', line)
                  if value_match:
                      openapi_version = value_match.group(1)
                      break
          if openapi_version != version:
              raise SystemExit('openapi.yaml info.version does not match the tag')

          changelog = (root / 'CHANGELOG.md').read_text()
          escaped = re.escape(version)
          if not re.search(
              rf'^## \[{escaped}\] — [0-9]{{4}}-[0-9]{{2}}-[0-9]{{2}}$',
              changelog,
              re.MULTILINE,
          ):
              raise SystemExit('CHANGELOG.md release heading is missing')
          if not re.search(
              rf'^\[{escaped}\]: https://github\.com/knievel-ads/knievel/'
              rf'(?:compare/\S+\.\.\.v{escaped}|releases/tag/v{escaped})$',
              changelog,
              re.MULTILINE,
          ):
              raise SystemExit('CHANGELOG.md release link is missing or inconsistent')
          expected_unreleased = (
              f'[Unreleased]: https://github.com/knievel-ads/knievel/'
              f'compare/v{version}...HEAD'
          )
          if expected_unreleased not in changelog.splitlines():
              raise SystemExit('CHANGELOG.md Unreleased link does not start at this tag')

          license_path = root / 'LICENSE'
          if not license_path.is_file():
              raise SystemExit('top-level MIT LICENSE is required')
          license_text = license_path.read_text()
          for marker in (
              'MIT License',
              'Permission is hereby granted, free of charge',
              'THE SOFTWARE IS PROVIDED "AS IS"',
          ):
              if marker not in license_text:
                  raise SystemExit(f'LICENSE is not consistent MIT text: missing {marker!r}')

          output = pathlib.Path(os.environ['GITHUB_OUTPUT'])
          with output.open('a') as handle:
              handle.write(f'tag={tag}\nversion={version}\nsha={sha}\n')
          PY

  publish-image:
    name: publish image (${{ matrix.platform }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    steps:
      - name: Checkout preflighted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: knievel-publish-${{ matrix.arch }}
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin build
      - name: Build and strip native binaries
        run: |
          set -euo pipefail
          cargo build --release --locked --bin knievel --bin knievel-cli
          strip target/release/knievel target/release/knievel-cli
      - name: Stage minimal Docker context
        run: |
          set -euo pipefail
          mkdir -p docker-context/web/admin
          install -m 0755 target/release/knievel docker-context/knievel
          install -m 0755 target/release/knievel-cli docker-context/knievel-cli
          cp -R web/admin/dist docker-context/web/admin/dist
          cp Dockerfile docker-context/Dockerfile
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: docker-context
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Export verified per-architecture digest
        env:
          BUILD_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          digest="$BUILD_DIGEST"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-image-merge:
    name: publish image (manifest)
    needs: [preflight, publish-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      digest: ${{ steps.merge.outputs.digest }}
      tag: ${{ needs.preflight.outputs.tag }}
    steps:
      - name: Download architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - name: Setup Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute canonical and compatibility aliases
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.preflight.outputs.tag }},priority=1000
            type=semver,pattern={{version}},value=${{ needs.preflight.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.preflight.outputs.tag }}
            type=semver,pattern={{major}},value=${{ needs.preflight.outputs.tag }}
            type=sha,prefix=sha-,format=short
      - name: Create and inspect manifest list
        id: merge
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          RELEASE_TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done
          refs=()
          for digest_file in *; do
            [[ "$digest_file" =~ ^[0-9a-f]{64}$ ]]
            refs+=("${IMAGE}@sha256:${digest_file}")
          done
          test "${#refs[@]}" -eq 2
          docker buildx imagetools create "${tag_args[@]}" "${refs[@]}"
          digest=$(docker buildx imagetools inspect "${IMAGE}:${RELEASE_TAG}" \
            --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign v3.1.3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign manifest list
        env:
          DIGEST: ${{ steps.merge.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
      - name: Attest manifest build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.merge.outputs.digest }}
          push-to-registry: true

  build-cli:
    name: build knievel-cli (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            musl: true
            macos: false
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            musl: true
            macos: false
          - target: aarch64-apple-darwin
            runner: macos-15
            musl: false
            macos: true
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Checkout preflighted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: knievel-cli-${{ matrix.target }}
          targets: ${{ matrix.target }}
      - name: Install musl linker
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build CLI
        run: cargo build --release --locked --bin knievel-cli --target '${{ matrix.target }}'
      - name: Verify, strip, and package exact contents
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAG: ${{ needs.preflight.outputs.tag }}
          IS_MACOS: ${{ matrix.macos }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/knievel-cli"
          test -x "$bin"
          test "$("$bin" --version)" = "knievel-cli ${VERSION}"
          strip "$bin"
          test "$("$bin" --version)" = "knievel-cli ${VERSION}"
          if [[ "$IS_MACOS" == true ]]; then
            test "$(uname -m)" = arm64
            minos=$(otool -l "$bin" | awk '/minos/{print $2; exit}')
            test "$minos" = '11.0'
          fi

          staging="knievel-cli-${TAG}-${TARGET}"
          mkdir -p "dist/${staging}"
          install -m 0755 "$bin" "dist/${staging}/knievel-cli"
          cp README.md LICENSE "dist/${staging}/"
          test "$("dist/${staging}/knievel-cli" --version)" = "knievel-cli ${VERSION}"
          tar -czf "dist/${staging}.tar.gz" -C dist "$staging"
          expected=$(printf '%s\n' \
            "${staging}/" \
            "${staging}/LICENSE" \
            "${staging}/README.md" \
            "${staging}/knievel-cli" | sort)
          actual=$(tar -tzf "dist/${staging}.tar.gz" | sort)
          test "$actual" = "$expected"
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum "${staging}.tar.gz" > "${staging}.tar.gz.sha256")
          else
            (cd dist && shasum -a 256 "${staging}.tar.gz" > "${staging}.tar.gz.sha256")
          fi
      - name: Install Cosign v3.1.3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign CLI archive
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          archive="dist/knievel-cli-${TAG}-${TARGET}.tar.gz"
          cosign sign-blob --yes --bundle "${archive}.cosign.bundle" "$archive"
      - name: Upload CLI package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cli-${{ matrix.target }}
          path: |
            dist/knievel-cli-${{ needs.preflight.outputs.tag }}-${{ matrix.target }}.tar.gz
            dist/knievel-cli-${{ needs.preflight.outputs.tag }}-${{ matrix.target }}.tar.gz.sha256
            dist/knievel-cli-${{ needs.preflight.outputs.tag }}-${{ matrix.target }}.tar.gz.cosign.bundle
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: github release
    needs: [preflight, publish-image-merge, build-cli]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download CLI packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: cli-*
          merge-multiple: true
      - name: Verify packages and build aggregate checksums
        run: |
          set -euo pipefail
          cd dist
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l | tr -d ' ')" -eq 3
          test "$(find . -maxdepth 1 -name '*.tar.gz.sha256' | wc -l | tr -d ' ')" -eq 3
          test "$(find . -maxdepth 1 -name '*.tar.gz.cosign.bundle' | wc -l | tr -d ' ')" -eq 3
          for sidecar in ./*.tar.gz.sha256; do
            sha256sum --check "$sidecar"
          done
          sha256sum -- ./*.tar.gz | sed 's|  \./|  |' > checksums.txt
      - name: Compose release notes
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ needs.publish-image-merge.outputs.digest }}
        run: |
          cat > RELEASE_NOTES.md <<EOF
          ## ${TAG}

          ### Container image

          Canonical tag: \`${IMAGE}:${TAG}\`

          Compatibility tag: \`${IMAGE}:${VERSION}\`

          Digest: \`${DIGEST}\`

          Verify with Cosign:

          \`cosign verify ${IMAGE}@${DIGEST} --certificate-identity-regexp 'https://github.com/${{ github.repository }}/.github/workflows/release.yml.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`

          ### knievel-cli

          This release contains native packages for Linux x86_64, Linux arm64,
          and Apple Silicon macOS. Every archive contains exactly the CLI,
          README.md, and MIT LICENSE, with SHA-256 and Cosign sidecars.
          EOF
      - name: Create GitHub Release # zizmor: ignore[superfluous-actions] strict unmatched-file handling
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            dist/knievel-cli-*.tar.gz
            dist/knievel-cli-*.tar.gz.sha256
            dist/knievel-cli-*.tar.gz.cosign.bundle
            dist/checksums.txt

  publish-helm:
    name: publish helm chart
    needs: [preflight, publish-image-merge]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout preflighted commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Package chart
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: >-
          helm package charts/knievel
          --version "$VERSION"
          --app-version "$VERSION"
          --destination .
      - name: Push chart
        id: push
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          output=$(helm push "knievel-${VERSION}.tgz" \
            "oci://${REGISTRY}/${{ github.repository_owner }}/charts" 2>&1)
          printf '%s\n' "$output"
          digest=$(awk '/Digest:/ {print $2}' <<< "$output")
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install Cosign v3.1.3
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Sign chart
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${{ github.repository_owner }}/charts/knievel@${DIGEST}"
      - name: Verify chart pull
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/chart-verify"
          cd "$RUNNER_TEMP/chart-verify"
          helm pull "oci://${REGISTRY}/${{ github.repository_owner }}/charts/knievel" --version "$VERSION"
          test -s "knievel-${VERSION}.tgz"

  release-ruby-gem:
    name: release ruby gem
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Checkout preflighted knievel commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          persist-credentials: false
      - name: Clone public downstream without privileged credentials
        env:
          DOWNSTREAM: ${{ github.repository_owner }}/knievel-ruby
        run: git clone --branch main "https://github.com/${DOWNSTREAM}.git" knievel-ruby
      - name: Seed generator configuration
        run: |
          cp .github/ruby-client/openapi-generator-config.json knievel-ruby/openapi-generator-config.json
          cp .github/ruby-client/.openapi-generator-ignore knievel-ruby/.openapi-generator-ignore
      - name: Generate Ruby client with OpenAPI Generator v7.24.0
        uses: openapi-generators/openapitools-generator-action@b729d184e6b3459572c37c0e37f88a832e69b552 # v1.5.0
        with:
          generator: ruby
          generator-tag: v7.24.0@sha256:5bf3dc75f764c584da8e3344c51b2f3f1e74703461d46a035b5ac1d31515cc88
          config-file: knievel-ruby/openapi-generator-config.json
          openapi-file: openapi.yaml
          command-args: >-
            --additional-properties=gemVersion=${{ needs.preflight.outputs.version }},library=faraday
            --output=knievel-ruby
      - name: Keep generated lockfile untracked
        run: |
          touch knievel-ruby/.gitignore
          grep -qxF Gemfile.lock knievel-ruby/.gitignore || echo Gemfile.lock >> knievel-ruby/.gitignore
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          working-directory: knievel-ruby
          bundler-cache: false
      - name: Build and load-check generated gem before privilege escalation
        working-directory: knievel-ruby
        env:
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          set -euo pipefail
          bundle config set --local frozen false
          bundle install --jobs=4
          rake build
          gem_file=$(find pkg -maxdepth 1 -name '*.gem' -print -quit)
          test -n "$gem_file"
          unpack_dir=$(mktemp -d)
          gem unpack "$gem_file" --target "$unpack_dir" >/dev/null
          actual=$(ruby -I "$unpack_dir"/*/lib -e "require 'knievel'; print Knievel::VERSION")
          test "$actual" = "$VERSION"
      - name: Upload built gem
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: knievel-${{ needs.preflight.outputs.version }}.gem
          path: knievel-ruby/pkg/*.gem
          if-no-files-found: error
          retention-days: 30
      - name: Prepare downstream commit and tag without credentials
        working-directory: knievel-ruby
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "downstream tag ${TAG} already exists; release reruns are not idempotent" >&2
            exit 1
          fi
          git config user.name 'knievel-pipelines[bot]'
          git config user.email 'knievel-pipelines[bot]@users.noreply.github.com'
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate from knievel ${TAG}"
          fi
          git tag -a "$TAG" -m "Generated from knievel ${TAG}"
      - name: Mint downstream-only GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.KNIEVEL_PIPELINES_CLIENT_ID }}
          private-key: ${{ secrets.KNIEVEL_PIPELINES_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: knievel-ruby
          permission-contents: write
      - name: Atomically push downstream main and tag
        working-directory: knievel-ruby
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          DOWNSTREAM: ${{ github.repository_owner }}/knievel-ruby
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          set -euo pipefail
          git remote set-url origin "https://x-access-token:${APP_TOKEN}@github.com/${DOWNSTREAM}.git"
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${TAG}:refs/tags/${TAG}"
