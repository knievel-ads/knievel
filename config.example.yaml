# Knievel configuration matching src/config.rs.
#
# Precedence: Rust defaults < this file < KNIEVEL_ environment overrides.
# Nested environment keys use a double underscore. Dollar-brace environment
# interpolation runs over the raw file before YAML parsing; an unset reference
# without a fallback is a startup error.

api:
  bind_addr: 0.0.0.0:8080
  # Parsed and required in this typed block, but currently NOT applied to
  # click_url/impression_url; decision responses contain relative /e/... paths.
  public_base_url: ${KNIEVEL_PUBLIC_BASE_URL:http://localhost:8080}
  # Empty means no CORS middleware. Use literal origins; wildcards are not
  # supported and credentials remain disabled.
  allowed_origins: []
  shutdown_drain_timeout_secs: 30
  # Parsed, but current shutdown enforcement passes only the drain timeout to
  # poem. This total budget is not enforced yet.
  shutdown_total_timeout_secs: 60

database:
  url: postgres://knievel_app:${DB_PASSWORD}@${DB_HOST}:${DB_PORT:5432}/${DB_NAME:knievel}?sslmode=${DB_SSLMODE:require}
  max_connections: 8
  auto_migrate: true
  required: true
  connect_retry:
    attempts: 5
    initial_backoff_ms: 1000
    max_backoff_ms: 16000

logging:
  level: ${KNIEVEL_LOG_LEVEL:info}
  format: json
  request_log_enabled: true
  request_log_skip_paths:
    - /healthz
    - /readyz
  request_log_slow_ms: 1000

events:
  # The only effective events config field today. Flush interval and batch size
  # are constants in src/events.rs.
  channel_capacity: 8192

decisions:
  force_overrides_enabled: true

partitions:
  # Attached events_raw leaves older than this are detached, not dropped.
  retention_days: 30

# Opaque DB-backed authentication remains active regardless of this list.
# A non-empty issuer list additionally enables JWT-shaped bearer verification.
# See AUTH.md for the exact issuer fields and the RSA-only runtime caveat.
auth:
  jwt:
    issuers: []

admin_ui:
  # Empty disables the static /admin/ mount. Release images set the nested env
  # override to /var/lib/knievel/admin by default.
  static_dir: "${KNIEVEL_ADMIN_UI_STATIC_DIR:}"
  oidc:
    issuer: "${KNIEVEL_ADMIN_UI_OIDC_ISSUER:}"
    client_id: "${KNIEVEL_ADMIN_UI_OIDC_CLIENT_ID:}"
    scopes: [openid, profile, knievel]
    require_oidc: false

# Parsed but stubbed: enabling this only logs a message. No OTel exporter is
# installed in the current binary.
tracing:
  otel:
    enabled: false
    endpoint: "${OTEL_EXPORTER_OTLP_ENDPOINT:}"
    service_name: knievel

# Parsed but stubbed: enabling this only logs a message. No Sentry SDK is
# installed in the current binary.
errors:
  sentry:
    enabled: false
    dsn: "${SENTRY_DSN:}"
    environment: "${KNIEVEL_ENV:}"
