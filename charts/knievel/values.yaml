# Default values for the current Knievel chart.
#
# IMPORTANT: a rendered key is not necessarily consumed by src/config.rs.
# Legacy template-required values are retained and explicitly labeled below;
# changing workload templates is outside this documentation correction.

image:
  repository: ghcr.io/knievel-ads/knievel
  # Empty uses Chart.appVersion. Use X.Y.Z for a semver image tag, or
  # sha256:<hex> for repository@sha256:<hex>. A sha-<commit> value is a tag.
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

nameOverride: ""
fullnameOverride: ""
replicaCount: 2

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: "2"
    memory: 1Gi

database:
  host: ""
  port: 5432
  name: ""
  sslMode: require
  # Required for a working pod. The Secret must contain username/password,
  # unless the key names below are overridden.
  existingSecret: ""
  userKey: username
  passwordKey: password
  # Effective runtime fields rendered into database.*.
  maxConnections: 8
  autoMigrate: true

# The template renders all four keys under events.*. The current Rust binary
# consumes ONLY channel_capacity. retentionDays, flushIntervalMs, and
# flushBatchSize are ignored; runtime partition retention stays at the Rust
# default because this chart does not render partitions.retention_days.
events:
  retentionDays: 30
  flushIntervalMs: 1000
  flushBatchSize: 5000
  channelCapacity: 8192

decisions:
  forceOverridesEnabled: false

logging:
  level: info
  format: json
  # Rendered as logging.decisions_sample_rate, which current Rust ignores.
  decisionsSampleRate: 0.01
  requestLogEnabled: true
  requestLogSkipPaths:
    - /healthz
    - /readyz
  requestLogSlowMs: 1000

api:
  bindAddr: "0.0.0.0:8080"
  # ApiConfig requires this field whenever the api block is rendered. The
  # localhost default keeps lint/render usable; every non-local install must
  # override it. Current server code parses it but still emits relative /e/...
  # tracking paths.
  publicBaseUrl: "http://localhost:8080"

# Public admin-SPA OIDC metadata. The release image serves /admin/ by default;
# both OIDC and paste-token auth store bearer material in sessionStorage.
adminUi:
  oidc:
    issuer: ""
    clientId: ""
    scopes:
      - openid
      - profile
      - knievel
    requireOidc: false

# Effective API-side JWT policies. Empty means opaque-only. Use RS256: the
# current decoding-key builder supports RSA JWKs only. See AUTH.md.
auth:
  jwt:
    issuers: []
    # Example item shape:
    # - issuer: https://identity.example.com/realms/ads
    #   audience: knievel
    #   algorithms: [RS256]
    #   jwksUrl: ""
    #   claim: knievel
    #   claimMapping:
    #     rules: []

# UNSUPPORTED CURRENTLY. Existing templates reference these values, so they
# remain for chart compatibility, but render a top-level sentry block that
# src/config.rs ignores. Even correctly nested errors.sentry is only a stub.
sentry:
  enabled: false
  existingSecret: ""
  dsnKey: dsn
  environment: ""
  tracesSampleRate: 0.0
  release: ""

# UNSUPPORTED CURRENTLY. Existing templates render a top-level otel block that
# src/config.rs ignores. Even correctly nested tracing.otel installs no exporter.
otel:
  enabled: false
  endpoint: ""
  serviceName: knievel
  resourceAttributes: {}

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts: []
    # - host: ads.example.com
    #   paths:
    #     - path: /
    #       pathType: Prefix
  tls: []

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  name: ""
  annotations: {}

# UNSUPPORTED CURRENTLY. Enabling this renders a valid ServiceMonitor pointed
# at /metrics, but the server has no /metrics route. Keep disabled.
serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s
  labels: {}

nodeSelector: {}
tolerations: []
affinity: {}
topologySpreadConstraints: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
    timeoutSeconds: 1
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 2
    periodSeconds: 5
    timeoutSeconds: 1
    failureThreshold: 3
