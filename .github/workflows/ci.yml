name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  prime:
    name: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.143
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Compile test targets
        run: cargo nextest run --no-run --workspace --lib --bins --tests --examples --locked
      - name: Compile benchmarks separately
        run: cargo build --workspace --benches --locked

  unit-prop:
    name: unit + property
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.143
      - run: >-
          cargo nextest run --workspace --locked
          -E 'kind(lib) + kind(bin)'
          --no-tests=pass

  db-integ:
    name: integration (Postgres 16)
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knievel
        options: >-
          --health-cmd "pg_isready -U postgres -d knievel"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://knievel_app:dev@localhost:5432/knievel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.143
      - name: Provision non-superuser test role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d knievel <<'SQL'
            CREATE ROLE knievel_app WITH NOSUPERUSER CREATEDB LOGIN PASSWORD 'dev';
            GRANT ALL PRIVILEGES ON DATABASE knievel TO knievel_app;
            GRANT ALL PRIVILEGES ON SCHEMA public TO knievel_app;
            DO $$ BEGIN CREATE ROLE knievel_loader NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
            GRANT knievel_loader TO knievel_app;
          SQL
      - run: >-
          cargo nextest run --workspace --locked
          -E 'kind(test) & binary(/^integration_/)'
          --no-tests=pass

  api-contract:
    name: api / contract (Postgres 16)
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knievel
        options: >-
          --health-cmd "pg_isready -U postgres -d knievel"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://knievel_app:dev@localhost:5432/knievel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.143
      - name: Provision non-superuser test role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d knievel <<'SQL'
            CREATE ROLE knievel_app WITH NOSUPERUSER CREATEDB LOGIN PASSWORD 'dev';
            GRANT ALL PRIVILEGES ON DATABASE knievel TO knievel_app;
            GRANT ALL PRIVILEGES ON SCHEMA public TO knievel_app;
            DO $$ BEGIN CREATE ROLE knievel_loader NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
            GRANT knievel_loader TO knievel_app;
          SQL
      - run: >-
          cargo nextest run --workspace --locked
          -E 'kind(test) & binary(/^api_/)'
          --no-tests=pass

  xtask-lints:
    name: xtask linters
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - run: cargo xtask lint-migrations
      - run: cargo xtask check-cross-tenant
      - run: cargo xtask test-shape
      - run: cargo xtask check-doc-fences
      - run: cargo xtask check-api-doc
      - run: cargo xtask check-snake-case

  doc-links:
    name: doc link check (lychee)
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check repository links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          lycheeVersion: v0.24.2
          args: >-
            --offline
            --no-progress
            --include-fragments
            './**/*.md'
          fail: true

  openapi-drift:
    name: openapi drift
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - run: cargo xtask openapi --check

  ui-client-drift:
    name: ui client drift
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - uses: ./.github/actions/node-setup
      - run: cargo xtask ui-client --check

  ui-typecheck:
    name: ui typecheck
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin typecheck

  ui-lint:
    name: ui lint
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin lint
      - run: pnpm --dir web/admin format:check

  ui-test:
    name: ui test
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin test --run

  ui-build:
    name: ui build
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin build

  helm-lint:
    name: helm lint + kubeconform
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.21.4
      - name: Install verified kubeconform v0.8.0
        env:
          KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/kubeconform-linux-amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 --retry 3 --fail --silent --show-error --location \
            https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz \
            --output "$archive"
          echo "$KUBECONFORM_SHA256  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" kubeconform
          sudo install -m 0755 "$RUNNER_TEMP/kubeconform" /usr/local/bin/kubeconform
          kubeconform -v
      - run: helm lint charts/knievel
      - name: Render and validate every optional chart branch
        run: |
          set -euo pipefail
          helm template knievel charts/knievel \
            --set database.host=aurora.example.com \
            --set database.name=knievel \
            --set database.existingSecret=knievel-db \
            --set ingress.enabled=true \
            --set 'ingress.hosts[0].host=knievel.example.com' \
            --set 'ingress.hosts[0].paths[0].path=/' \
            --set 'ingress.hosts[0].paths[0].pathType=Prefix' \
            --set serviceMonitor.enabled=true \
            > "$RUNNER_TEMP/knievel-rendered.yaml"
          kubeconform -strict -kubernetes-version 1.30.0 \
            -schema-location 'https://raw.githubusercontent.com/yannh/kubernetes-json-schema/c8f4e61c63bc529749125ac566bccc6986e08d45/{{.NormalizedKubernetesVersion}}-standalone-strict/{{.ResourceKind}}.json' \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/becbe1103d096697610985b89f1630b2ab549982/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -summary "$RUNNER_TEMP/knievel-rendered.yaml"

  gem-build:
    name: gem build + smoke
    needs: openapi-drift
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout knievel
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone public knievel-ruby read-only
        env:
          DOWNSTREAM: ${{ github.repository_owner }}/knievel-ruby
        run: git clone --depth 1 --branch main "https://github.com/${DOWNSTREAM}.git" knievel-ruby
      - name: Seed generator configuration
        run: |
          cp .github/ruby-client/openapi-generator-config.json knievel-ruby/openapi-generator-config.json
          cp .github/ruby-client/.openapi-generator-ignore knievel-ruby/.openapi-generator-ignore
      - name: Generate Ruby client with OpenAPI Generator v7.24.0
        uses: openapi-generators/openapitools-generator-action@b729d184e6b3459572c37c0e37f88a832e69b552 # v1.5.0
        with:
          generator: ruby
          generator-tag: v7.24.0@sha256:5bf3dc75f764c584da8e3344c51b2f3f1e74703461d46a035b5ac1d31515cc88
          config-file: knievel-ruby/openapi-generator-config.json
          openapi-file: openapi.yaml
          command-args: >-
            --additional-properties=gemVersion=999.0.0,library=faraday
            --output=knievel-ruby
      - name: Keep generated lockfile untracked
        run: |
          touch knievel-ruby/.gitignore
          grep -qxF Gemfile.lock knievel-ruby/.gitignore || echo Gemfile.lock >> knievel-ruby/.gitignore
      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          working-directory: knievel-ruby
          bundler-cache: false
      - name: Build and load-check gem
        working-directory: knievel-ruby
        run: |
          set -euo pipefail
          bundle config set --local frozen false
          bundle install --jobs=4
          rake build
          gem_file=$(find pkg -maxdepth 1 -name '*.gem' -print -quit)
          test -n "$gem_file"
          unpack_dir=$(mktemp -d)
          gem unpack "$gem_file" --target "$unpack_dir" >/dev/null
          actual=$(ruby -I "$unpack_dir"/*/lib -e "require 'knievel'; print Knievel::VERSION")
          test "$actual" = '999.0.0'
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin build
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: knievel-gem-build
      - name: Build native release binaries
        run: |
          set -euo pipefail
          cargo build --release --locked --bin knievel --bin knievel-cli
          strip target/release/knievel target/release/knievel-cli
      - name: Stage Docker context
        run: |
          set -euo pipefail
          mkdir -p docker-context/web/admin
          install -m 0755 target/release/knievel docker-context/knievel
          install -m 0755 target/release/knievel-cli docker-context/knievel-cli
          cp -R web/admin/dist docker-context/web/admin/dist
          cp Dockerfile docker-context/Dockerfile
      - name: Build local image
        run: docker build --tag knievel:gem-smoke docker-context
      - name: Boot Postgres and knievel
        env:
          KNIEVEL_IMAGE: knievel:gem-smoke
        run: |
          set -euo pipefail
          mkdir -p tmp
          chmod 0777 tmp
          docker compose -f examples/compose/compose.yaml up -d knievel-postgres knievel
      - name: Wait for migrations and health
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 90))
          until curl --fail --silent --show-error http://localhost:8080/healthz >/dev/null; do
            if (( SECONDS >= deadline )); then
              echo 'knievel /healthz never came up' >&2
              exit 1
            fi
            sleep 2
          done
      - name: Seed deterministic demo
        env:
          KNIEVEL_IMAGE: knievel:gem-smoke
        run: docker compose -f examples/compose/compose.yaml run --rm knievel-seed
      - name: Capture seed token
        run: |
          set -euo pipefail
          test -s tmp/knievel-dev-token
          sudo chmod 0644 tmp/knievel-dev-token
          token=$(<tmp/knievel-dev-token)
          test -n "$token"
          echo "KNIEVEL_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Run smoke against unpacked built gem
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/knievel-gem"
          gem unpack knievel-ruby/pkg/*.gem --target "$RUNNER_TEMP/knievel-gem" >/dev/null
          ruby -I "$RUNNER_TEMP"/knievel-gem/*/lib examples/compose/gem_smoke.rb
      - name: Dump compose logs
        if: always()
        continue-on-error: true
        run: docker compose -f examples/compose/compose.yaml logs --no-color
      - name: Tear down compose stack
        if: always()
        run: docker compose -f examples/compose/compose.yaml down --volumes

  acceptance:
    name: acceptance shard ${{ matrix.shard }}/4
    needs: prime
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16@sha256:e17e86066e5ef83e0952a9347f5c792b7ece00972e2aa787a6986f471b3dd3d5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: knievel
        options: >-
          --health-cmd "pg_isready -U postgres -d knievel"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
        ports: ['5432:5432']
    env:
      DATABASE_URL: postgres://knievel_app:dev@localhost:5432/knievel
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
      - name: Install cargo-nextest
        uses: taiki-e/install-action@5b4d68e2e660441203ab128a23676f1e4faf1532 # v2.86.3
        with:
          tool: cargo-nextest@0.9.143
      - name: Provision non-superuser test role
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d knievel <<'SQL'
            CREATE ROLE knievel_app WITH NOSUPERUSER CREATEDB LOGIN PASSWORD 'dev';
            GRANT ALL PRIVILEGES ON DATABASE knievel TO knievel_app;
            GRANT ALL PRIVILEGES ON SCHEMA public TO knievel_app;
            DO $$ BEGIN CREATE ROLE knievel_loader NOLOGIN BYPASSRLS; EXCEPTION WHEN duplicate_object THEN NULL; END $$;
            GRANT knievel_loader TO knievel_app;
          SQL
      - name: Run acceptance shard
        run: >-
          cargo nextest run --workspace --locked
          -E 'kind(test) & binary(acceptance)'
          --partition count:${{ matrix.shard }}/4
          --no-tests=pass

  msrv:
    name: Rust 1.94.1 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact MSRV
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: 1.94.1
      - run: cargo +1.94.1 check --workspace --all-targets --locked

  macos-smoke:
    name: macOS Apple Silicon CLI smoke
    runs-on: macos-15
    timeout-minutes: 35
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/rust-setup
        with:
          shared-key: knievel-macos-smoke
      - name: Build and inspect CLI
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cargo build --release --locked --bin knievel-cli
          version=$(awk -F '"' '/^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          test "$(target/release/knievel-cli --version)" = "knievel-cli $version"
          minos=$(otool -l target/release/knievel-cli | awk '/minos/{print $2; exit}')
          test "$minos" = '11.0'

  result:
    name: CI result
    if: ${{ always() }}
    needs:
      - prime
      - unit-prop
      - db-integ
      - api-contract
      - xtask-lints
      - doc-links
      - openapi-drift
      - ui-client-drift
      - ui-typecheck
      - ui-lint
      - ui-test
      - ui-build
      - helm-lint
      - gem-build
      - acceptance
      - msrv
      - macos-smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every CI lane to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          jq --exit-status 'to_entries | all(.value.result == "success")' <<< "$NEEDS_JSON"
