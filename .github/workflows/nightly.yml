name: nightly

on:
  schedule:
    - cron: '13 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

# This workflow currently covers only browser and bundle checks. The nine
# chaos_* files are ignored skeletons with no fault-injection harness, so this
# workflow deliberately makes no chaos, fuzz, benchmark, or Postgres-matrix
# coverage claim.

jobs:
  ui-e2e:
    name: ui e2e (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin exec playwright install --with-deps chromium
      - run: pnpm --dir web/admin build
      - run: pnpm --dir web/admin test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: web/admin/playwright-report
          if-no-files-found: warn
          retention-days: 7

  ui-size-limit:
    name: ui bundle size budgets
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/node-setup
      - run: pnpm --dir web/admin size
